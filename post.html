<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

/* Add a gray background color with some padding */
body {
  font-family: Arial;
  color: white;
  padding: 20px;
  background: #5a0b0b;
}

/* Header/Blog Title */
.header {
  padding: 30px;
  font-size: 40px;
  text-align: center;
  background: #9c0404;
}

/* Left column with a larger 10% gap on the outer left */
.leftcolumn {
  float: left;
  width: 55%;
  margin-left: 10%; 
}

/* Right column with a larger 8% gap on the outer right */
.rightcolumn {
  float: right; 
  width: 20%;
  margin-right: 13%; 
}

/* Fake image */
.fakeimg {
  background-color: #aaa;
  width: 100%;
  padding: 20px;
}

/* Add a card effect for articles */
.card {
   background-color: #290e0e;
   padding: 20px;
   margin-top: 20px;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Footer */
.footer {
  max-width: 1500px;         
  width: 100%;                
  margin: 20px auto !important; 
  display: block;           
  padding: 20px;
  text-align: center;
  background: #3f3f3f;
}

/* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 800px) {
  .leftcolumn, .rightcolumn {   
    width: 100%;
    padding: 0;
    float: none;        /* Removes the desktop float behavior */
    margin-left: 0;     /* Resets the 10% desktop left margin */
    margin-right: 0;    /* Resets the 13% desktop right margin */
  }
}
</style>
</head>
<body>

<div class="header">
  <h2>Posts</h2>
</div>

         <h5>Sept 13, 2026</h5>
        </div>
 </div>
  <div class="rightcolumn">
    <div class="card">

      <div class="fakeimg"><a href="photos.html" style="color: white">Photos</a></div>
    </div>
  </div>
</div>

<div class="footer">

</div>

</body>
</html>

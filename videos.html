<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}

/* Add a gray background color with some padding */
body {
  font-family: Arial;
  padding: 20px;
  background: #fdc1b4;
}

/* Header/Blog Title */
.header {
  padding: 30px;
  font-size: 40px;
  text-align: center;
  background: #FE9179;
}

/* Create two unequal columns that floats next to each other */
/* Left column */
.leftcolumn {   
  float: left;
  width: 75%;
}

/* Right column */
.rightcolumn {
  float: left;
  width: 25%;
  padding-left: 20px;
}

/* Fake image */
.fakeimg {
  background-color: #aaa;
  width: 100%;
  padding: 20px;
}

/* Add a card effect for articles */
.card {
   background-color: #BCDDDC;
   padding: 20px;
   margin-top: 20px;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Footer */
.footer {
  padding: 20px;
  text-align: center;
  background: #ffedd1;
  margin-top: 20px;
}

/* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 800px) {
  .leftcolumn, .rightcolumn {   
    width: 100%;
    padding: 0;
  }
}
</style>
</head>
<body>

<div class="header">
  <h2>Videos</h2>
</div>

<div class="row">
  <div class="leftcolumn">
    <div class="card">
      <h2>The DOG Shortfilm</h2>

      <iframe width="100%" height="315" 
              src="https://www.youtube.com/embed/2am0wnR36GI?si=pdNH75wVIRiNDRTP"
              title="The DOG Shortfilm" 
              frameborder="0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
              allowfullscreen>
      </iframe>
    </div>
  </div>
  <div class="rightcolumn">
    <div class="card">
      <h3>Where to next?!</h3>
      <div class="fakeimg"><a href="index.html" style="color: black">Home</a></div><br>
      <div class="fakeimg">Blog Posts</div><br>
      <div class="fakeimg"><a href="videos.html" style="color: black">Videos</a></div><br>
      <div class="fakeimg">Assignments</div><br>
      <div class="fakeimg">Music</div>
    </div>
    </div>
    </div>
<div class="footer">
  <h2>Thanks for visiting!</h2>

</div>

</body>
</html>
